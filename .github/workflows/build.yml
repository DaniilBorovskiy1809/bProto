name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            panel/backend -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: panel/frontend/pnpm-lock.yaml
      - run: pnpm --dir panel/frontend install --frozen-lockfile
      - run: ./build_app.sh --check
      - run: cargo test --locked --manifest-path panel/backend/Cargo.toml
      - name: Package Linux and panel with installation resources
        run: |
          tar -czf bproto-linux-x86_64.tar.gz dist
          sha256sum bproto-linux-x86_64.tar.gz > bproto-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-panel
          path: bproto-linux-x86_64.tar.gz*
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build APK with three native ABIs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./build_app.sh --android --no-panel
          test -s dist/apk/bproto-0.1.0-debug.apk
          unzip -l dist/apk/*.apk | grep lib/arm64-v8a/libbproto.so
          unzip -l dist/apk/*.apk | grep lib/armeabi-v7a/libbproto.so
          unzip -l dist/apk/*.apk | grep lib/x86_64/libbproto.so
          sha256sum dist/apk/*.apk > dist/apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: dist/apk/
          if-no-files-found: error

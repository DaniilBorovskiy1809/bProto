name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n bootstrap.sh install.sh build_app.sh run.sh
      - run: python3 -m unittest discover -s tests -p test_installers.py -v
      - run: python3 -m unittest discover -s tests -p 'test_connection_*.py' -v
      - run: python3 -m unittest discover -s tests -p test_tls_bridge.py -v
      - name: QUIC integration and coverage
        run: |
          python3 -m venv /tmp/quic-tests
          /tmp/quic-tests/bin/pip install -r tools/quic-bridge/requirements.txt coverage==7.13.1
          /tmp/quic-tests/bin/python -m coverage run --data-file=/tmp/quic-coverage --source=tools/quic-bridge -m unittest discover -s tests -p test_quic_bridge.py -v
          /tmp/quic-tests/bin/python -m coverage report --data-file=/tmp/quic-coverage --fail-under=70
          /tmp/quic-tests/bin/python -m coverage run --data-file=/tmp/agent-coverage --source=tools/config-agent -m unittest discover -s tests -p test_config_agent.py -v
          /tmp/quic-tests/bin/python -m coverage report --data-file=/tmp/agent-coverage --fail-under=70
  linux-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            panel/backend -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: panel/frontend/pnpm-lock.yaml
      - run: pnpm --dir panel/frontend install --frozen-lockfile
      - run: ./build_app.sh --check
      - run: python3 tools/connection_lab.py --bin-dir target/release smoke
      - run: cargo test --locked --manifest-path panel/backend/Cargo.toml
      - name: Package Linux and panel with installation resources
        run: |
          tar -czf bproto-linux-x86_64.tar.gz dist
          sha256sum bproto-linux-x86_64.tar.gz > bproto-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-panel
          path: bproto-linux-x86_64.tar.gz*
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use Android SDK supplied by the GitHub runner
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build APK with three native ABIs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./build_app.sh --android --no-panel
          gradle -p apps/android testDebugUnitTest
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test -s "dist/apk/bproto-$version-debug.apk"
          unzip -l dist/apk/*.apk | grep lib/arm64-v8a/libbproto.so
          unzip -l dist/apk/*.apk | grep lib/armeabi-v7a/libbproto.so
          unzip -l dist/apk/*.apk | grep lib/x86_64/libbproto.so
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for symbol in connect assignedIp socketFd pump stop close lastError version; do
              "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only "dist/android/jniLibs/$abi/libbproto.so" | grep "Java_dev_bproto_Bproto_$symbol$" > /dev/null
            done
          done
          sha256sum dist/apk/*.apk > dist/apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: dist/apk/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-panel, android, installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-panel
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: release-assets/android
      - name: Package source installation resources and checksums
        run: |
          git archive --format=tar.gz --prefix=bproto-${GITHUB_REF_NAME}/ HEAD > release-assets/bproto-${GITHUB_REF_NAME}-source.tar.gz
          cd release-assets
          rm -f *.sha256 android/SHA256SUMS
          mv android/*.apk .
          sha256sum *.tar.gz *.apk > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.tar.gz release-assets/*.apk release-assets/SHA256SUMS --verify-tag --title "bProto ${GITHUB_REF_NAME}" --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"

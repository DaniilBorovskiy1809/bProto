name: ci

# The Arena sandbox can reach github.com but not the Actions results service,
# so every job writes its console output to ci-logs/ and commits it back to the
# branch. The log commit is tagged [skip ci] and the paths filter below keeps it
# from re-triggering this workflow.

on:
  push:
    branches: ["**"]
    paths-ignore: ["ci-logs/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: v1

      - name: Build and test
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ci-logs
          {
            echo "== rustc =="; rustc --version
            echo

            echo "############ RUST WORKSPACE"
            # There is no rustfmt in the driving sandbox, so let the runner do
            # the formatting and commit the result back with the log.
            cargo fmt --all 2>&1 | tail -5 || true
            for cmd in \
              "cargo fmt --all --check" \
              "cargo build --workspace --all-targets" \
              "cargo clippy --workspace --all-targets -- -D warnings" \
              "cargo test --workspace" \
              "cargo test -p bproto --features jni" \
              ; do
              echo "############ \$ $cmd"
              if eval "$cmd" 2>&1; then echo "-- OK: $cmd"; else echo "-- FAILED: $cmd"; fi
              echo
            done

            echo "############ PANEL BACKEND"
            cd panel/backend
            cargo fmt 2>&1 | tail -5 || true
            for cmd in "cargo fmt --check" "cargo build --all-targets" "cargo test"; do
              echo "############ \$ (panel) $cmd"
              if eval "$cmd" 2>&1; then echo "-- OK: $cmd"; else echo "-- FAILED: $cmd"; fi
              echo
            done
            cd "$GITHUB_WORKSPACE"

            echo "############ PANEL FRONTEND"
            cd panel/frontend
            npm install -g pnpm@9 2>&1 | tail -2
            if pnpm install --frozen-lockfile 2>&1 | tail -5; then
              echo "############ \$ npx tsc --noEmit"
              npx tsc --noEmit 2>&1 && echo "-- OK: tsc" || echo "-- FAILED: tsc"
              echo "############ \$ npm run build"
              npm run build 2>&1 | tail -20 && echo "-- OK: build" || echo "-- FAILED: build"
            else
              echo "-- FAILED: pnpm install"
            fi
            cd "$GITHUB_WORKSPACE"

            echo "############ SHELL SCRIPTS: syntax"
            for f in build_app.sh run.sh install.sh; do
              if bash -n "$f" 2>&1; then echo "-- OK: bash -n $f"; else echo "-- FAILED: bash -n $f"; fi
            done
            echo

            echo "############ FUNCTIONAL: build_app.sh --check"
            # The documented gate. It is a script, so it is only real if it runs.
            if timeout 900 ./build_app.sh --check --no-panel --no-ffi 2>&1; then
              echo "-- OK: build_app.sh --check"
            else
              echo "-- FAILED: build_app.sh --check"
            fi
            echo

            echo "############ FUNCTIONAL: run.sh demo"
            if timeout 120 ./run.sh demo 3 2>&1; then echo "-- OK: run.sh demo"; else echo "-- FAILED: run.sh demo"; fi
            echo

            echo "############ FUNCTIONAL: server --check-config"
            ./run.sh check-config 2>&1 && echo "-- OK: check-config" || echo "-- FAILED: check-config"
          } 2>&1 | tee "ci-logs/gate-${GITHUB_RUN_ID}.log"

      - name: Commit the log
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          # One file per run. A single reused name made two concurrent runs
          # rebase-conflict over the log itself.
          ls -1t ci-logs/gate-*.log 2>/dev/null | tail -n +4 | xargs -r rm -f
          for _ in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
            sleep 3
          done
          mkdir -p ci-logs
          git add -f ci-logs
          git diff --cached --quiet && exit 0
          git commit -q -m "ci: gate log for ${GITHUB_SHA::7} [skip ci]"
          for _ in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 3
          done
